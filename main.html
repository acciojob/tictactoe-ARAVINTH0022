<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tic Tac Toe</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
            margin: 20px auto;
            justify-content: center;
        }
        .cell {
            background-color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }
        .cell:hover {
            background-color: #d0d0d0;
        }
        .message {
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: bold;
        }
        input {
            padding: 8px;
            margin: 5px;
            font-size: 1rem;
        }
        button {
            padding: 8px 15px;
            font-size: 1rem;
            cursor: pointer;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Input Form View -->
        <div id="form-container">
            <h1>Tic Tac Toe</h1>
            <div>
                <input type="text" id="player-1" placeholder="Player 1 Name">
            </div>
            <div>
                <input type="text" id="player-2" placeholder="Player 2 Name">
            </div>
            <div>
                <button id="submit">Submit</button>
            </div>
        </div>

        <!-- Game Board View -->
        <div id="game-container" class="hidden">
            <h1>Tic Tac Toe</h1>
            <div class="message" id="message"></div>
            <div class="board" id="board">
                <div class="cell" id="1"></div>
                <div class="cell" id="2"></div>
                <div class="cell" id="3"></div>
                <div class="cell" id="4"></div>
                <div class="cell" id="5"></div>
                <div class="cell" id="6"></div>
                <div class="cell" id="7"></div>
                <div class="cell" id="8"></div>
                <div class="cell" id="9"></div>
            </div>
        </div>
    </div>

    <script>
        const submitBtn = document.getElementById('submit');
        const formContainer = document.getElementById('form-container');
        const gameContainer = document.getElementById('game-container');
        const messageDiv = document.getElementById('message');
        const cells = document.querySelectorAll('.cell');

        let player1 = '';
        let player2 = '';
        let currentPlayer = '';
        let currentSymbol = 'x';
        let boardState = ['', '', '', '', '', '', '', '', ''];
        let isGameOver = false;

        const winningCombinations = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
            [0, 4, 8], [2, 4, 6]            // Diagonals
        ];

        submitBtn.addEventListener('click', () => {
            player1 = document.getElementById('player-1').value.trim() || 'Player 1';
            player2 = document.getElementById('player-2').value.trim() || 'Player 2';
            
            formContainer.classList.add('hidden');
            gameContainer.classList.remove('hidden');

            currentPlayer = player1;
            messageDiv.innerText = `${currentPlayer}, you're up`;
        });

        cells.forEach(cell => {
            cell.addEventListener('click', (e) => {
                const index = parseInt(e.target.id) - 1;

                if (boardState[index] !== '' || isGameOver) {
                    return;
                }

                boardState[index] = currentSymbol;
                e.target.innerText = currentSymbol;

                // Check for win
                let roundWon = false;
                for (let i = 0; i < winningCombinations.length; i++) {
                    const [a, b, c] = winningCombinations[i];
                    if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
                        roundWon = true;
                        break;
                    }
                }

                if (roundWon) {
                    messageDiv.innerText = `${currentPlayer} congratulations you won!`;
                    isGameOver = true;
                    return;
                }

                // Check for draw
                if (!boardState.includes('')) {
                    messageDiv.innerText = `It's a draw!`;
                    isGameOver = true;
                    return;
                }

                // Switch turn
                if (currentSymbol === 'x') {
                    currentSymbol = 'o';
                    currentPlayer = player2;
                } else {
                    currentSymbol = 'x';
                    currentPlayer = player1;
                }

                messageDiv.innerText = `${currentPlayer}, you're up`;
            });
        });
    </script>
</body>
</html>
